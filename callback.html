<!DOCTYPE html>
<html>
<head><title>Signing in...</title></head>
<body>
<p>Signing in, please wait...</p>
<script>
  // Grab token from hash
  const hash = new URLSearchParams(location.hash.slice(1));
  const token = hash.get('access_token');
  const expires = hash.get('expires_in');
  if (token) {
    localStorage.setItem('gm_tok', token);
    localStorage.setItem('gm_exp', Date.now() + parseInt(expires||3600)*1000);
    window.location.replace('https://thelordnelson.github.io/gmail-manager/gmail-manager.html');
  } else {
    document.body.innerHTML = '<p>Sign-in failed — no token received. <a href="gmail-manager.html">Try again</a></p>';
  }
</script>
</body>
</html>
